[project]
name = "nem"
version = "0.1.0"
description = "Mini replication of Ye & Steinhardt norm-enforcement for AI agents, plus a verifier-attack extension"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.60",
    "httpx>=0.27",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
